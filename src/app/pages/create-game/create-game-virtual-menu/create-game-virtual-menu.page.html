<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        color="dark"
        defaultHref="/"
        text="{{ 'General.back_button' | translate }}"
      ></ion-back-button>
    </ion-buttons>
    <ion-title
      >{{ "CreateGame.titleCreateGameVirtualMenu" | translate }}</ion-title
    >
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="menu-cards">
    <ion-card
      *ngFor="let virEnv of virEnvTypesList"
      (click)="navigateCreateVRGame(virEnv.layerName)"
    >
      <ion-card-header>
        <img src="{{virEnv.img_url}}" />
        <!-- Use the layer ID so hiding environments leaves their numbers stable. -->
        <ion-card-subtitle>{{ virEnv.layerName.replace("VirEnv_", "") }}: {{ virEnv.envName }}</ion-card-subtitle>
        <!-- <ion-card-title>pre</ion-card-title> -->
      </ion-card-header>
    </ion-card>
  </div>
</ion-content>
