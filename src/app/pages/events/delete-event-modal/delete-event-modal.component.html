<ion-header>
  <ion-toolbar>
    <ion-title color="danger">{{ "Events.deleteTitle" | translate }}</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">
        <ion-icon slot="icon-only" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <p [innerHTML]="'Events.deleteWarning' | translate: { name: eventName }"></p>

  <ion-item>
    <ion-label position="stacked">
      {{ "Events.deleteConfirmLabel" | translate }}
    </ion-label>
    <ion-input
      [(ngModel)]="typedName"
      placeholder="{{ eventName }}"
      autocapitalize="off"
    ></ion-input>
  </ion-item>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">{{ "Events.cancel" | translate }}</ion-button>
      <ion-button
        fill="solid"
        color="danger"
        [disabled]="!nameMatches"
        (click)="confirm()"
      >
        {{ "Events.delete" | translate }}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-footer>
