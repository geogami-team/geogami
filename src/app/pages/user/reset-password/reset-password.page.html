<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        color="dark"
        defaultHref="/"
        text="{{ 'General.back_button' | translate }}"
      ></ion-back-button>
    </ion-buttons>
    <ion-title>{{ "User.resetpw" | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="auth-wrap">
    <div class="auth-hero">
      <div class="auth-icon">
        <ion-icon name="keypad-outline"></ion-icon>
      </div>
      <h1>{{ "User.resetpw" | translate }}</h1>
    </div>

    <section class="card">
      <ion-card class="error-card" color="danger" *ngIf="error">
        <ion-card-content> {{error}} </ion-card-content>
      </ion-card>

      <form (ngSubmit)="resetPassword()" [formGroup]="loginForm">
        <p
          class="card-hint"
          [innerHTML]="'User.enterVirCode' | translate:{email: '<b>' + userEmail + '</b>'}"
        ></p>

        <div class="code-row">
          <ion-input #Field1 [(ngModel)]="codeInput[0]" (keyup)="onCodeKeyup($event, Field2)"
            (paste)="handleCodePaste($event, Field6)" maxlength="1" required [id]="'Input1'"
            formControlName="Input1" clear-on-edit="true" inputmode="numeric"></ion-input>
          <ion-input #Field2 [(ngModel)]="codeInput[1]" (keyup)="onCodeKeyup($event, Field3, Field1)"
            (paste)="handleCodePaste($event, Field6)" maxlength="1" required [id]="'Input2'"
            formControlName="Input2" clear-on-edit="true" inputmode="numeric"></ion-input>
          <ion-input #Field3 [(ngModel)]="codeInput[2]" (keyup)="onCodeKeyup($event, Field4, Field2)"
            (paste)="handleCodePaste($event, Field6)" maxlength="1" required [id]="'Input3'"
            formControlName="Input3" clear-on-edit="true" inputmode="numeric"></ion-input>
          <ion-input #Field4 [(ngModel)]="codeInput[3]" (keyup)="onCodeKeyup($event, Field5, Field3)"
            (paste)="handleCodePaste($event, Field6)" maxlength="1" required [id]="'Input4'"
            formControlName="Input4" clear-on-edit="true" inputmode="numeric"></ion-input>
          <ion-input #Field5 [(ngModel)]="codeInput[4]" (keyup)="onCodeKeyup($event, Field6, Field4)"
            (paste)="handleCodePaste($event, Field6)" maxlength="1" required [id]="'Input5'"
            formControlName="Input5" clear-on-edit="true" inputmode="numeric"></ion-input>
        </div>

        <ion-item class="form-item" lines="none">
          <ion-label position="stacked"
            >{{ "User.pl_newPassword" | translate }}</ion-label
          >
          <ion-input
            #Field6
            type="password"
            placeholder="{{ 'User.pl_newPassword' | translate }}"
            [id]="'password'"
            formControlName="password"
          ></ion-input>
        </ion-item>

        <ion-button
          class="submit-btn"
          expand="block"
          shape="round"
          type="submit"
          [disabled]="loginForm.invalid"
          >{{ "User.resetpw" | translate }}</ion-button
        >
      </form>
    </section>
  </div>
</ion-content>
