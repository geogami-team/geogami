<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button
        color="dark"
        defaultHref="/"
        text="{{ 'General.back_button' | translate }}"
      ></ion-back-button>
    </ion-buttons>
    <ion-title>{{ "User.forgotpw" | translate }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="auth-wrap">
    <div class="auth-hero">
      <div class="auth-icon">
        <ion-icon name="key-outline"></ion-icon>
      </div>
      <h1>{{ "User.forgotpw" | translate }}</h1>
    </div>

    <section class="card">
      <ion-card class="error-card" color="danger" *ngIf="error">
        <ion-card-content> {{error}} </ion-card-content>
      </ion-card>

      <form (ngSubmit)="resetPassword()" [formGroup]="loginForm">
        <p class="card-hint">{{ "User.enterEmail" | translate }}</p>

        <ion-item class="form-item" lines="none">
          <ion-label position="stacked"
            >{{ "User.mail" | translate }}</ion-label
          >
          <ion-input
            placeholder="E-Mail"
            [id]="'email'"
            formControlName="email"
          ></ion-input>
        </ion-item>

        <ion-button
          class="submit-btn"
          expand="block"
          shape="round"
          type="submit"
          [disabled]="loginForm.invalid"
          >{{ "User.resetpw" | translate }}</ion-button
        >
      </form>
    </section>
  </div>
</ion-content>
